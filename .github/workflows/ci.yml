name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ekko_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ekko_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Docker image builds
        run: docker build -t ekko-api .

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ekko_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
