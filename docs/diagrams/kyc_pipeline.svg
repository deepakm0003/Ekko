<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="640" viewBox="0 0 2000 640"><defs><marker id="ah2456D8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2456D8"/></marker><marker id="as2456D8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#2456D8"/></marker><marker id="ahE40000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E40000"/></marker><marker id="asE40000" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#E40000"/></marker><marker id="ah8A9099" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A9099"/></marker><marker id="as8A9099" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#8A9099"/></marker><marker id="ahA35F00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A35F00"/></marker><marker id="asA35F00" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#A35F00"/></marker><marker id="ah4A4F57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4A4F57"/></marker><marker id="as4A4F57" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4A4F57"/></marker><marker id="ah14804A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14804A"/></marker><marker id="as14804A" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#14804A"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1115" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#111318" text-anchor="start">Smart KYC pipeline — on-device, verifiable, privacy-first</text><text x="40" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#4A4F57" text-anchor="start">Photos are read on the phone and deleted; only masked, verified results are stored</text><rect x="40" y="130" width="272" height="190" rx="16" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.8" filter="url(#sh)"/><text x="60" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111318" text-anchor="start">1  Capture</text><text x="60" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">camera / gallery /</text><text x="60" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">DigiLocker (mock) /</text><text x="60" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">specimen K01–K12</text><line x1="316" y1="225" x2="360" y2="225" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><rect x="366" y="130" width="272" height="190" rx="16" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.8" filter="url(#sh)"/><text x="386" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111318" text-anchor="start">2  On-device OCR</text><text x="386" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">Google ML Kit</text><text x="386" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">text lines + corner</text><text x="386" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">points, no upload</text><line x1="642" y1="225" x2="686" y2="225" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><rect x="692" y="130" width="272" height="190" rx="16" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.8" filter="url(#sh)"/><text x="712" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111318" text-anchor="start">3  Parse</text><text x="712" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">de-skew by label angle</text><text x="712" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">drop watermark lines</text><text x="712" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">recover clipped labels</text><line x1="968" y1="225" x2="1012" y2="225" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><rect x="1018" y="130" width="272" height="190" rx="16" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.8" filter="url(#sh)"/><text x="1038" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111318" text-anchor="start">4  Repair IDs</text><text x="1038" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">GSTIN letter/digit</text><text x="1038" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">positions, check digit,</text><text x="1038" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">registry-confirmed only</text><line x1="1294" y1="225" x2="1338" y2="225" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><rect x="1344" y="130" width="272" height="190" rx="16" fill="#FFEEEE" stroke="#F5B5B5" stroke-width="1.8" filter="url(#sh)"/><text x="1364" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#A30000" text-anchor="start">5  Validate</text><text x="1364" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">12 checks vs GSTN &amp;</text><text x="1364" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">Udyam registries,</text><text x="1364" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">dates, names, roles</text><line x1="1620" y1="225" x2="1664" y2="225" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><rect x="1670" y="130" width="272" height="190" rx="16" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.8" filter="url(#sh)"/><text x="1690" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#111318" text-anchor="start">6  Verdict</text><text x="1690" y="204.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">Verified / Action /</text><text x="1690" y="226.5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">Rejected + fix steps</text><text x="1690" y="249.0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#4A4F57" text-anchor="start">for the owner</text><line x1="655.0" y1="330" x2="655.0" y2="372" stroke="#14804A" stroke-width="2.2" marker-end="url(#ah14804A)"/><rect x="300" y="376" width="620" height="54" rx="12" fill="#E6F6ED" stroke="#BFE5CF" stroke-width="1.5"/><text x="610" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#14804A" text-anchor="middle">photo file deleted immediately after OCR · screenshots blocked</text><text x="40" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#111318" text-anchor="start">What the checks catch on the case specimens</text><rect x="40" y="500" width="470" height="50" rx="12" fill="#FFEEEE" stroke="#FFEEEE" stroke-width="1.5"/><text x="58" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A30000" text-anchor="start">K01</text><text x="150" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">GSTIN cancelled · Udyam blank</text><rect x="525" y="500" width="470" height="50" rx="12" fill="#E6F6ED" stroke="#E6F6ED" stroke-width="1.5"/><text x="543" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#14804A" text-anchor="start">K02</text><text x="635" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">tilted 7°, 0/O fixed → verified</text><rect x="1010" y="500" width="470" height="50" rx="12" fill="#FFF3DF" stroke="#FFF3DF" stroke-width="1.5"/><text x="1028" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A35F00" text-anchor="start">K04</text><text x="1120" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">blurred → re-upload</text><rect x="1495" y="500" width="470" height="50" rx="12" fill="#FFEEEE" stroke="#FFEEEE" stroke-width="1.5"/><text x="1513" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A30000" text-anchor="start">K06</text><text x="1605" y="532" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">check digit fails → tampered</text><rect x="40" y="562" width="470" height="50" rx="12" fill="#FFEEEE" stroke="#FFEEEE" stroke-width="1.5"/><text x="58" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A30000" text-anchor="start">K07</text><text x="150" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">legal name ≠ registry</text><rect x="525" y="562" width="470" height="50" rx="12" fill="#FFF3DF" stroke="#FFF3DF" stroke-width="1.5"/><text x="543" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A35F00" text-anchor="start">K08/K09</text><text x="635" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">office admin can't sign</text><rect x="1010" y="562" width="470" height="50" rx="12" fill="#FFF3DF" stroke="#FFF3DF" stroke-width="1.5"/><text x="1028" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#A35F00" text-anchor="start">K11</text><text x="1120" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">bill older than 90 days</text><rect x="1495" y="562" width="470" height="50" rx="12" fill="#E6F6ED" stroke="#E6F6ED" stroke-width="1.5"/><text x="1513" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#14804A" text-anchor="start">K03/K12</text><text x="1605" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#111318" text-anchor="start">clean → verified</text></svg>