0,10 z" fill="#A35F00"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1115" flood-opacity="0.10"/></filter></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="40" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#111318" text-anchor="start">Advisor request flow — AI understands, rules decide</text><text x="40" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#4A4F57" text-anchor="start">A plan can never contain an ineligible product or an invented price</text><rect x="50" y="112" width="240" height="52" rx="12" fill="#111318" stroke="#111318" stroke-width="1.5"/><text x="170" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">Owner</text><line x1="170" y1="166" x2="170" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><rect x="350" y="112" width="240" height="52" rx="12" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="470" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#111318" text-anchor="middle">Advisor UI</text><line x1="470" y1="166" x2="470" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><rect x="650" y="112" width="240" height="52" rx="12" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="770" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#111318" text-anchor="middle">On-device parser</text><line x1="770" y1="166" x2="770" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><rect x="960" y="112" width="240" height="52" rx="12" fill="#2456D8" stroke="#DCDFE4" stroke-width="1.5"/><text x="1080" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">Backend → Groq LLM</text><line x1="1080" y1="166" x2="1080" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><rect x="1270" y="112" width="240" height="52" rx="12" fill="#E40000" stroke="#DCDFE4" stroke-width="1.5"/><text x="1390" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">Rules engine</text><line x1="1390" y1="166" x2="1390" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><rect x="1600" y="112" width="240" height="52" rx="12" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="1720" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#111318" text-anchor="middle">Pricing &amp; Health</text><line x1="1720" y1="166" x2="1720" y2="720" stroke="#DCDFE4" stroke-width="2" stroke-dasharray="4 6"/><line x1="178" y1="212" x2="462" y2="212" stroke="#4A4F57" stroke-width="2.2" marker-end="url(#ah4A4F57)"/><text x="320.0" y="202" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A4F57" text-anchor="middle">taps a chip, types or speaks (Hindi / Tamil / Marathi / English)</text><line x1="478" y1="262" x2="762" y2="262" stroke="#4A4F57" stroke-width="2.2" marker-end="url(#ah4A4F57)"/><text x="620.0" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A4F57" text-anchor="middle">understand answer</text><rect x="610" y="282" width="320" height="60" rx="10" fill="#E6F6ED" stroke="#BFE5CF" stroke-width="1.5"/><text x="770" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14804A" text-anchor="middle">numbers, cities, business types,</text><text x="770" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#14804A" text-anchor="middle">GSTIN regex, Devanagari digits</text><line x1="778" y1="372" x2="1072" y2="372" stroke="#2456D8" stroke-width="2.2" marker-end="url(#ah2456D8)"/><text x="925.0" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2456D8" text-anchor="middle">not understood → free text</text><line x1="1072" y1="412" x2="778" y2="412" stroke="#2456D8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah2456D8)"/><text x="925.0" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#2456D8" text-anchor="middle">profile fields as strict JSON (or null → offline chips)</text><line x1="478" y1="462" x2="1382" y2="462" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><text x="930.0" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#E40000" text-anchor="middle">BusinessProfile: segment, size, sites, tier, GST status, needs, pincode</text><rect x="1240" y="482" width="300" height="108" rx="10" fill="#FFEEEE" stroke="#F5B5B5" stroke-width="1.5"/><text x="1260" y="506.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A30000" text-anchor="start">tier · active GSTIN · min staff</text><text x="1260" y="523.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A30000" text-anchor="start">min sites · dependencies</text><text x="1260" y="541.1" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A30000" text-anchor="start">fibre feasibility · budget</text><text x="1260" y="558.65" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A30000" text-anchor="start">→ substitute, auto-add or block</text><line x1="1398" y1="612" x2="1712" y2="612" stroke="#E40000" stroke-width="2.2" marker-end="url(#ahE40000)"/><text x="1555.0" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#E40000" text-anchor="middle">validated bundle</text><rect x="1760" y="590" width="230" height="68" rx="10" fill="#FFFFFF" stroke="#DCDFE4" stroke-width="1.5"/><text x="1774" y="614.0" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A4F57" text-anchor="start">setup = Σ setup × qty</text><text x="1774" y="631.55" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A4F57" text-anchor="start">contract = longest minimum term</text><line x1="1712" y1="690" x2="478" y2="690" stroke="#4A4F57" stroke-width="2.2" marker-end="url(#ah4A4F57)"/><text x="1095.0" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A4F57" text-anchor="middle">one monthly price · health score · reasons · notices</text><text x="40" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#8A9099" text-anchor="start">Optional: the validated plan goes back to the AI only to be explained in the owner's language — it cannot change items or prices.</text></svg>