services:
  - type: web
    name: ekko-api
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: EKKO_ENV
        value: production
      - key: EKKO_JWT_SECRET
        generateValue: true
      - key: EKKO_DEMO_OTP
        value: "true"          # set to false once an SMS gateway is wired in
      - key: EKKO_DATABASE_URL
        fromDatabase:
          name: ekko-db
          property: connectionString
      - key: ANTHROPIC_API_KEY # optional: the advisor runs rule-based without it
        sync: false

databases:
  - name: ekko-db
    plan: free
